<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#070711"
  >

  <meta
    name="description"
    content="Kirong AI — an intelligent assistant built by Kirong Job Kwemoi."
  >

  <title>Kirong AI — Intelligent Assistant</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <main class="container">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

      <div class="headerLeft">

        <h1>
          ⚡ Kirong AI🌏
        </h1>

        <select
          id="languageSelect"
          aria-label="Language"
        >

          <option value="English">
            English
          </option>

          <option value="Swahili">
            Kiswahili
          </option>

          <option value="French">
            Français
          </option>

          <option value="Spanish">
            Español
          </option>

        </select>

      </div>


      <button
        id="themeBtn"
        type="button"
        aria-label="Toggle theme"
      >
        🌙
      </button>

    </header>



    <!-- =========================
         CHAT
    ========================== -->

    <section
      id="chatBox"
      aria-live="polite"
    >

      <div class="message ai">

        <p>

          Hello 👋
          <br><br>

          I am
          <strong>
            Kirong AI
          </strong>.

          <br><br>

          How can I help you today?

        </p>

      </div>

    </section>



    <!-- =========================
         THINKING
    ========================== -->

    <div
      id="thinking"
      class="hidden"
      aria-live="polite"
    >
      Kirong AI is thinking...
    </div>



    <!-- =========================
         ⚡ QUICK ACTIONS
    ========================== -->

    <nav
      class="quickActions"
      aria-label="Quick actions"
    >

      <!-- 💻 CODE -->

      <button
        class="quickBtn"
        data-action="Code"
        type="button"
      >
        💻 Code
      </button>


      <!-- 🧠 EXPLAIN -->

      <button
        class="quickBtn"
        data-action="Explain"
        type="button"
      >
        🧠 Explain
      </button>


      <!-- ✍️ WRITE -->

      <button
        class="quickBtn"
        data-action="Write"
        type="button"
      >
        ✍️ Write
      </button>


      <!-- 🎨 IMAGE -->

      <button
        class="quickBtn"
        data-action="Image"
        type="button"
      >
        🎨 Image
      </button>


      <!-- 📧 EMAIL -->

      <button
        class="quickBtn"
        data-action="Email"
        type="button"
      >
        📧 Email
      </button>


      <!-- 💼 BUSINESS -->

      <button
        class="quickBtn"
        data-action="Business"
        type="button"
      >
        💼 Business
      </button>


      <!-- 📚 STUDY -->

      <button
        class="quickBtn"
        data-action="Study"
        type="button"
      >
        📚 Study
      </button>


      <!-- 🌍 TRANSLATE -->

      <button
        class="quickBtn"
        data-action="Translate"
        type="button"
      >
        🌍 Translate
      </button>


      <!-- 📊 ANALYZE -->

      <button
        class="quickBtn"
        data-action="Analyze"
        type="button"
      >
        📊 Analyze
      </button>


      <!-- 🧑🏽‍💻 DEVELOPER -->

      <button
        class="quickBtn"
        data-action="Developer"
        type="button"
      >
        🧑🏽‍💻 Developer
      </button>


      <!-- 📍 LOCATION -->

      <button
        id="locationBtn"
        type="button"
        aria-label="Share location"
        title="Share location"
      >
        📍
      </button>

    </nav>



    <!-- =========================
         INPUT
    ========================== -->

    <form
      class="inputArea"
      id="chatForm"
    >

      <!-- 🎤 VOICE LANGUAGE -->

      <select
        id="voiceSelect"
        aria-label="Voice language"
      >

        <option value="en-US">
          EN
        </option>

        <option value="sw-KE">
          SW
        </option>

      </select>


      <!-- 📎 FILE -->

      <button
        id="uploadBtn"
        type="button"
        aria-label="Upload file"
      >
        📎
      </button>


      <input
        type="file"
        id="fileInput"
        hidden
      >


      <!-- 💬 MESSAGE -->

      <input
        type="text"
        id="userInput"
        placeholder="Message Kirong AI..."
        autocomplete="off"
        maxlength="4000"
        aria-label="Message"
      >


      <!-- 🎤 MICROPHONE -->

      <button
        id="micBtn"
        type="button"
        aria-label="Voice input"
      >
        🎤
      </button>


      <!-- ➤ SEND -->

      <button
        id="sendBtn"
        type="submit"
        aria-label="Send message"
      >
        ➤
      </button>

    </form>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footerButtons">

      <button
        id="exportBtn"
        type="button"
      >
        Export 💾
      </button>


      <button
        id="clearBtn"
        type="button"
      >
        Clear 🗑️
      </button>

    </footer>


  </main>


  <script src="app.js"></script>

</body>

</html>
