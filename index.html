<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#070711"
  >

  <meta
    name="description"
    content="Kirong AI — an intelligent AI assistant built by Kirong Job Kwemoi."
  >

  <meta
    name="author"
    content="Kirong Job Kwemoi"
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <title>Kirong AI — Intelligent Assistant</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <!-- =====================================================
       MAIN APP
  ====================================================== -->

  <main class="container">


    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header class="header">

      <div class="headerLeft">

        <div class="brandArea">

          <h1>
            ⚡ Kirong AI🌏
          </h1>

          <span class="brandStatus">
            ● Online
          </span>

        </div>


        <!-- LANGUAGE -->

        <select
          id="languageSelect"
          aria-label="Select language"
          title="Select language"
        >

          <option value="English">
            English
          </option>

          <option value="Swahili">
            Kiswahili
          </option>

          <option value="French">
            Français
          </option>

          <option value="Spanish">
            Español
          </option>

          <option value="Hindi">
            हिन्दी
          </option>

        </select>

      </div>


      <!-- HEADER ACTIONS -->

      <div class="headerActions">

        <!--
          Shelves button is created by app.js
        -->

        <button
          id="themeBtn"
          type="button"
          aria-label="Toggle theme"
          title="Toggle theme"
        >
          🌙
        </button>

      </div>

    </header>



    <!-- ===================================================
         CHAT AREA
    ==================================================== -->

    <section
      id="chatBox"
      aria-live="polite"
      aria-label="Kirong AI conversation"
    >

      <!-- =================================================
           WELCOME SCREEN
      ================================================== -->

      <div class="kirongWelcome">

        <div class="kirongWelcomeLogo">
          ⚡
        </div>

        <h2>
          Hello, I'm
          <span>Kirong AI</span>
          👋
        </h2>

        <p>
          Your intelligent AI assistant.
          <br>
          Ask me anything, build something,
          or let's solve a problem together.
        </p>

        <div class="welcomeHint">

          <span>✨</span>

          <span>
            What can I help you with today?
          </span>

        </div>

      </div>


    </section>



    <!-- ===================================================
         THINKING INDICATOR
    ==================================================== -->

    <div
      id="thinking"
      class="hidden"
      aria-live="polite"
    >
      Kirong AI is thinking
    </div>



    <!-- ===================================================
         QUICK ACTIONS
    ==================================================== -->

    <nav
      class="quickActions"
      aria-label="Quick actions"
    >

      <button
        class="quickBtn"
        data-action="Code"
        type="button"
        title="Coding assistant"
      >
        💻 Code
      </button>


      <button
        class="quickBtn"
        data-action="Explain"
        type="button"
        title="Explain something"
      >
        🧠 Explain
      </button>


      <button
        class="quickBtn"
        data-action="Write"
        type="button"
        title="Writing assistant"
      >
        ✍️ Write
      </button>


      <button
        class="quickBtn"
        data-action="Image"
        type="button"
        title="Generate an image"
      >
        🎨 Image
      </button>


      <button
        class="quickBtn"
        data-action="Email"
        type="button"
        title="Write an email"
      >
        📧 Email
      </button>


      <button
        class="quickBtn"
        data-action="Business"
        type="button"
        title="Business assistant"
      >
        💼 Business
      </button>


      <button
        class="quickBtn"
        data-action="Study"
        type="button"
        title="Study assistant"
      >
        📚 Study
      </button>


      <button
        class="quickBtn"
        data-action="Translate"
        type="button"
        title="Translate text"
      >
        🌍 Translate
      </button>


      <button
        class="quickBtn"
        data-action="Analyze"
        type="button"
        title="Analyze information"
      >
        📊 Analyze
      </button>


      <button
        class="quickBtn"
        data-action="Developer"
        type="button"
        title="Developer tools"
      >
        🧑🏽‍💻 Developer
      </button>


      <button
        class="quickBtn"
        data-action="Ideas"
        type="button"
        title="Generate ideas"
      >
        💡 Ideas
      </button>


      <button
        class="quickBtn"
        data-action="Summarize"
        type="button"
        title="Summarize text"
      >
        📝 Summarize
      </button>


      <button
        id="locationBtn"
        type="button"
        aria-label="Share location"
        title="Share location"
      >
        📍
      </button>

    </nav>



    <!-- ===================================================
         MESSAGE INPUT
    ==================================================== -->

    <form
      class="inputArea"
      id="chatForm"
      autocomplete="off"
    >

      <!-- VOICE LANGUAGE -->

      <select
        id="voiceSelect"
        aria-label="Voice language"
        title="Voice language"
      >

        <option value="en-US">
          EN
        </option>

        <option value="sw-KE">
          SW
        </option>

      </select>


      <!-- FILE UPLOAD -->

      <button
        id="uploadBtn"
        type="button"
        aria-label="Upload file"
        title="Upload file"
      >
        📎
      </button>


      <input
        type="file"
        id="fileInput"
        hidden
        accept=".txt,.pdf,.doc,.docx,.csv,.json,.js,.html,.css,.py,.md,image/*"
      >


      <!-- MESSAGE INPUT -->

      <input
        type="text"
        id="userInput"
        placeholder="Message Kirong AI..."
        autocomplete="off"
        maxlength="12000"
        aria-label="Message Kirong AI"
      >


      <!-- VOICE INPUT -->

      <button
        id="micBtn"
        type="button"
        aria-label="Voice input"
        title="Voice input"
      >
        🎤
      </button>


      <!-- SEND -->

      <button
        id="sendBtn"
        type="submit"
        aria-label="Send message"
        title="Send message"
      >
        ➤
      </button>

    </form>



    <!-- ===================================================
         FOOTER
    ==================================================== -->

    <footer class="footerButtons">

      <button
        id="exportBtn"
        type="button"
        title="Export current chat"
      >
        Export 💾
      </button>


      <button
        id="clearBtn"
        type="button"
        title="Clear current chat"
      >
        Clear 🗑️
      </button>

    </footer>


  </main>



  <!-- =====================================================
       APP ENGINE
  ====================================================== -->

  <script
    src="app.js"
    defer
  ></script>

</body>

</html>
