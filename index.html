<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#6D28D9"
  >

  <meta
    name="description"
    content="Kirong AI — an intelligent AI assistant built by Kirong Job Kwemoi."
  >

  <meta
    name="author"
    content="Kirong Job Kwemoi"
  >

  <title>Kirong AI — Intelligent Assistant</title>


  <!-- =====================================================
       📱 PWA
  ====================================================== -->

  <link
    rel="manifest"
    href="/manifest.json"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="/icon-192.png"
  >


  <!-- =====================================================
       🎨 STYLES
  ====================================================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =====================================================
       🌌 AMBIENT BACKGROUND
  ====================================================== -->

  <div
    class="ambient ambientOne"
    aria-hidden="true"
  ></div>

  <div
    class="ambient ambientTwo"
    aria-hidden="true"
  ></div>

  <div
    class="ambient ambientThree"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       🧠 MAIN APPLICATION
  ====================================================== -->

  <main class="container">


    <!-- ===================================================
         🧭 HEADER
    ==================================================== -->

    <header class="header">

      <div class="headerLeft">


        <!-- BRAND -->

        <div class="brandArea">

          <div
            class="brandLogo"
            aria-hidden="true"
          >
            ⚡
          </div>

          <div class="brandInfo">

            <h1>
              Kirong AI
            </h1>

            <span class="brandStatus">

              <span
                class="statusDot"
                aria-hidden="true"
              ></span>

              Online

            </span>

          </div>

        </div>


        <!-- LANGUAGE -->

        <select
          id="languageSelect"
          aria-label="Select language"
          title="Select language"
        >

          <option value="English">
            English
          </option>

          <option value="Swahili">
            Kiswahili
          </option>

          <option value="French">
            Français
          </option>

          <option value="Spanish">
            Español
          </option>

          <option value="Hindi">
            हिन्दी
          </option>

        </select>

      </div>


      <!-- =================================================
           HEADER ACTIONS
      ================================================== -->

      <div class="headerActions">


        <!--
          This ＋ button opens the Chats Shelf.
          It is NOT the WhatsApp button.
        -->

        <button
          id="newChatBtn"
          type="button"
          aria-label="Open chats"
          title="Open chats"
        >
          ＋
        </button>


        <!-- THEME -->

        <button
          id="themeBtn"
          type="button"
          aria-label="Toggle theme"
          title="Toggle theme"
        >
          🌙
        </button>

      </div>

    </header>


    <!-- ===================================================
         💬 CHAT AREA
    ==================================================== -->

    <section
      id="chatBox"
      class="chatBox"
      aria-live="polite"
      aria-label="Kirong AI conversation"
    >


      <!-- WELCOME -->

      <div
        class="kirongWelcome"
        id="kirongWelcome"
      >

        <div
          class="kirongWelcomeLogo"
          aria-hidden="true"
        >
          ⚡
        </div>


        <div class="welcomeEyebrow">

          <span></span>

          KIRONG AI CORE

          <span></span>

        </div>


        <h2>

          Hello, I'm

          <span>
            Kirong AI
          </span>

          👋

        </h2>


        <p>

          Your intelligent AI assistant for

          <strong>coding</strong>,

          <strong>learning</strong>,

          <strong>creativity</strong>,

          <strong>business</strong>

          and everyday tasks.

        </p>


        <div class="welcomeHint">

          <span
            class="hintIcon"
            aria-hidden="true"
          >
            ✨
          </span>

          <span>
            What can I help you with today?
          </span>

        </div>

      </div>


      <!-- THINKING -->

      <div
        id="thinking"
        class="thinking hidden"
        aria-live="polite"
      >

        <div class="thinkingOrb">
          ⚡
        </div>

        <div class="thinkingContent">

          <span>
            Kirong AI is thinking
          </span>

          <div class="thinkingDots">

            <i></i>
            <i></i>
            <i></i>

          </div>

        </div>

      </div>

    </section>


    <!-- ===================================================
         👑 WHATSAPP — TALK TO THE BOSS
    ==================================================== -->

    <div class="whatsappCTA">

      <button
        id="whatsappBtn"
        class="whatsappBtn"
        type="button"
        aria-label="Talk directly to Kirong Job Kwemoi on WhatsApp"
        title="Talk to the Boss on WhatsApp"
      >

        <span
          class="whatsappIcon"
          aria-hidden="true"
        >
          💬
        </span>


        <span class="whatsappText">

          <strong>
            Talk to the Boss
          </strong>

          <small>
            Chat directly with Kirong Job Kwemoi
          </small>

        </span>


        <span
          class="whatsappArrow"
          aria-hidden="true"
        >
          →
        </span>

      </button>

    </div>


    <!-- ===================================================
         ⚡ QUICK ACTIONS
    ==================================================== -->

    <nav
      class="quickActions"
      aria-label="Quick actions"
    >

      <button
        class="quickBtn"
        data-action="Code"
        type="button"
      >
        <span>💻</span>
        Code
      </button>


      <button
        class="quickBtn"
        data-action="Explain"
        type="button"
      >
        <span>🧠</span>
        Explain
      </button>


      <button
        class="quickBtn"
        data-action="Write"
        type="button"
      >
        <span>✍️</span>
        Write
      </button>


      <button
        class="quickBtn"
        data-action="Image"
        type="button"
      >
        <span>🎨</span>
        Image
      </button>


      <button
        class="quickBtn"
        data-action="Email"
        type="button"
      >
        <span>📧</span>
        Email
      </button>


      <button
        class="quickBtn"
        data-action="Business"
        type="button"
      >
        <span>💼</span>
        Business
      </button>


      <button
        class="quickBtn"
        data-action="Study"
        type="button"
      >
        <span>📚</span>
        Study
      </button>


      <button
        class="quickBtn"
        data-action="Translate"
        type="button"
      >
        <span>🌍</span>
        Translate
      </button>


      <button
        class="quickBtn"
        data-action="Analyze"
        type="button"
      >
        <span>📊</span>
        Analyze
      </button>


      <button
        class="quickBtn"
        data-action="Developer"
        type="button"
      >
        <span>🧑🏽‍💻</span>
        Developer
      </button>


      <button
        class="quickBtn"
        data-action="Ideas"
        type="button"
      >
        <span>💡</span>
        Ideas
      </button>


      <button
        class="quickBtn"
        data-action="Summarize"
        type="button"
      >
        <span>📝</span>
        Summarize
      </button>


      <!-- LOCATION -->

      <button
        id="locationBtn"
        type="button"
        aria-label="Share location"
        title="Share location"
      >
        📍
      </button>

    </nav>


    <!-- ===================================================
         💬 INPUT
    ==================================================== -->

    <form
      class="inputArea"
      id="chatForm"
      autocomplete="off"
    >


      <!-- VOICE -->

      <select
        id="voiceSelect"
        aria-label="Voice language"
      >

        <option value="en-US">
          EN
        </option>

        <option value="sw-KE">
          SW
        </option>

      </select>


      <!-- UPLOAD -->

      <button
        id="uploadBtn"
        type="button"
        aria-label="Upload file"
        title="Upload file"
      >
        📎
      </button>


      <input
        type="file"
        id="fileInput"
        hidden
        accept=".txt,.pdf,.doc,.docx,.csv,.json,.js,.html,.css,.py,.md,image/*"
      >


      <!-- MESSAGE -->

      <input
        type="text"
        id="userInput"
        placeholder="Message Kirong AI..."
        autocomplete="off"
        maxlength="4000"
        aria-label="Message Kirong AI"
      >


      <!-- MICROPHONE -->

      <button
        id="micBtn"
        type="button"
        aria-label="Voice input"
        title="Voice input"
      >
        🎤
      </button>


      <!-- SEND -->

      <button
        id="sendBtn"
        type="submit"
        aria-label="Send message"
        title="Send message"
      >
        ➤
      </button>

    </form>


    <!-- ===================================================
         FOOTER
    ==================================================== -->

    <footer class="footerButtons">

      <button
        id="exportBtn"
        type="button"
      >
        <span>💾</span>
        Export
      </button>


      <button
        id="clearBtn"
        type="button"
      >
        <span>🗑️</span>
        Clear
      </button>

    </footer>

  </main>


  <!-- =====================================================
       ⚡ KIRONG AI ENGINE
  ====================================================== -->

  <script
    src="app.js"
    defer
  ></script>


  <!-- =====================================================
       📱 PWA SERVICE WORKER
  ====================================================== -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("/sw.js")

            .then(
              () => {

                console.log(
                  "📱 Kirong AI PWA Ready!"
                );

              }
            )

            .catch(
              error => {

                console.error(
                  "❌ Kirong AI Service Worker failed:",
                  error
                );

              }
            );

        }
      );

    }

  </script>

</body>

</html>
